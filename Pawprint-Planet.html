  <style>
/* Focused case-study interactions */
.xray-card{position:relative;margin:2px 0 16px;padding:11px;background:#e8eee4;border:1px solid #d8e2d6;border-radius:14px}
.xray-label{font-size:9px;letter-spacing:.8px;font-weight:900;color:#607568;margin:0 0 8px 2px}
.xray-card svg{display:block;width:100%;height:auto;border-radius:10px}
.xray-hit{position:absolute;left:47%;top:53%;transform:translate(-50%,-50%);width:38px;height:38px;border:2px solid #f7d780;border-radius:50%;background:#f7d78030;color:#fff5c8;font-size:0;box-shadow:0 0 0 5px #f7d78022;animation:hotspot 1.5s ease-in-out infinite}
.xray-hit:after{content:'✦';font-size:21px;text-shadow:0 1px 4px #253c36}
@keyframes hotspot{50%{box-shadow:0 0 0 9px #f7d78012;transform:translate(-50%,-50%) scale(1.08)}}
.cast-workbench{display:grid;grid-template-columns:minmax(115px,.68fr) minmax(0,1.4fr);gap:12px;margin:3px 0 15px}
.model-leg-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:255px;border-radius:14px;background:linear-gradient(160deg,#f1f3e9,#e9eee2);border:1px solid #e1e7da;padding:12px 7px}
.leg-label{font-size:8px;letter-spacing:.7px;font-weight:900;color:#708077;text-align:center}
.model-leg{position:relative;display:flex;justify-content:center;align-items:center;height:187px;width:100%;margin:6px auto}
.bone-shape{position:relative;width:39px;height:147px;border-radius:20px;background:linear-gradient(90deg,#d3b88e,#f7e9ca 45%,#caaa7e);border:2px solid #bd9d71;box-shadow:0 7px 12px #40544418;transition:.25s}
.paw-end{position:absolute;z-index:5;bottom:0;left:50%;transform:translateX(-50%);font-size:23px;filter:drop-shadow(0 3px 2px #40544420)}
.leg-layer{position:absolute;display:block;left:50%;transform:translateX(-50%);width:100%;height:100%;border:1px solid #ffffffa8;box-shadow:0 4px 9px #40544418;transition:all .45s cubic-bezier(.2,.8,.2,1);animation:layerIn .35s ease-out}
.leg-layer.padding{inset:9px auto;transform:translateX(-50%);width:58px;height:auto;border-radius:24px;background:repeating-linear-gradient(135deg,#f4e9d7 0 5px,#fff9eb 5px 10px);border-color:#dbcbb1}
.leg-layer.support{inset:13px auto;transform:translateX(-50%);width:49px;height:auto;border-radius:21px;background:repeating-linear-gradient(0deg,#b5c6b4 0 8px,#d4dfcc 8px 12px);border-color:#91aa96}
.leg-layer.wrap{inset:17px auto;transform:translateX(-50%);width:44px;height:auto;border-radius:20px;background:repeating-linear-gradient(0deg,#e8ad87 0 10px,#f4c59f 10px 16px);border-color:#d99069}
@keyframes layerIn{from{opacity:0;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.layer-count{font-size:9px;font-weight:800;color:#607568;text-align:center}
.cast-materials{display:grid;gap:7px;align-content:center}
.material{position:relative;display:grid;grid-template-columns:26px 1fr;column-gap:8px;align-items:center;text-align:left;width:100%;padding:9px;border:1px solid #e1e7db;background:#fffefa;border-radius:11px;color:var(--ink);transition:.18s}
.material:not(:disabled):hover{border-color:#9ab496;background:#f5f8f1;transform:translateX(2px)}
.material>span{grid-row:1/3;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#eff3e9;font-size:14px}
.material strong{font-size:10px;line-height:1.3}
.material small{font-size:8px;line-height:1.35;color:#78857b;margin-top:2px}
.material.used{border-color:#b8cdb3;background:#f2f7ef;opacity:.78}
.material:disabled{cursor:default}
.done-mark{grid-column:2;color:#5d815f;font-size:8px;margin-top:3px}
.cast-progress{height:6px;border-radius:9px;background:#e7ece2;overflow:hidden;margin:0 0 12px}
.cast-progress-fill{height:100%;background:#7ea17b;border-radius:9px;transition:width .35s}
.healed-cat{position:relative;min-height:170px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(160deg,#edf2e7,#dfe9d9);overflow:hidden;margin:12px 0}
.healed-cat>div:nth-child(2){font-size:104px;filter:drop-shadow(0 10px 5px #40544420)}
.healed-spark{position:absolute;top:13px;left:17px;right:17px;text-align:center;color:#d6aa4e;letter-spacing:10px}
.cast-badge{position:absolute;bottom:12px;background:#fffefa;border-radius:99px;padding:8px 13px;font-size:10px;font-weight:900;color:#486c50;box-shadow:0 3px 10px #40544414}
.case-note{display:grid;gap:7px;padding:13px;background:#f3f5ed;border-radius:12px;color:#57695d;font-size:11px}
.case-note>b{font-size:12px;color:var(--ink)}
.case-note small{font-size:9px;line-height:1.5;color:#78847b;margin-top:3px}
.book-actions{display:flex;justify-content:flex-end;gap:8px;margin:15px 0}
.choice:disabled{cursor:default;opacity:.7}
@media(max-width:590px){.cast-workbench{grid-template-columns:110px minmax(0,1fr);gap:8px}.model-leg-wrap{min-height:232px;padding:9px 4px}.model-leg{height:168px}.bone-shape{height:131px}.material{padding:8px 7px;grid-template-columns:23px 1fr;gap:6px}.material>span{width:23px;height:23px}.material strong{font-size:9px}.material small{font-size:7px}.xray-hit{width:34px;height:34px}.case-row{grid-template-columns:44px 1fr}.case-row .case-badge{grid-column:2;justify-self:start}}

/* Treatment-learning cards */

.doctor-note-paper{position:relative;margin:11px 0 4px;padding:19px 17px 13px 23px;border:1px solid #ded9c9;border-radius:5px 13px 13px 5px;background:repeating-linear-gradient(to bottom,#fffdf6 0,#fffdf6 27px,#e8e6dc 28px,#fffdf6 29px);box-shadow:0 9px 22px #39483a16}
.doctor-note-paper:before{content:'';position:absolute;top:0;bottom:0;left:12px;border-left:2px solid #dfaaa0}
.doctor-note-heading{color:#263632;font:900 29px/1 var(--display);letter-spacing:-.7px}
.doctor-note-subheading{margin-top:5px;color:#5a715b;font:800 12px var(--display)}
.doctor-note-instructions{margin:13px 0 9px;color:#55645a;font-size:10px;line-height:1.5}
.doctor-note-example{padding:8px 10px;border-left:3px solid #88a27c;border-radius:0 7px 7px 0;background:#edf3e9;color:#5d6c5d;font-size:9px;line-height:1.45}
.doctor-note-example b{display:block;color:#4d694f;font-size:9px}
.doctor-note-label{display:block;margin:12px 0 4px;color:#66746a;font-size:9px;font-weight:900;letter-spacing:.4px}
.doctor-note-paper textarea{display:block;width:100%;min-height:150px;padding:8px 6px;border:0;outline:0;resize:vertical;background:transparent;color:#31433a;font:600 12px/28px var(--font)}
.doctor-note-paper textarea::placeholder{color:#96a095}
.doctor-note-footer{display:flex;justify-content:space-between;gap:8px;margin-top:3px;color:#7e897d;font-size:8px}
.activity-actions .primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.case-row-details{min-width:0}
.casebook-doctor-note{margin-top:10px;padding:11px 13px;border-left:3px solid #87a27a;border-radius:0 9px 9px 0;background:#f3f5ed;color:#56665a}
.casebook-doctor-note>b,.casebook-doctor-note>strong{display:block;color:#314b39;font:900 11px var(--display)}
.casebook-doctor-note p{margin:6px 0 0;color:#506157;font-size:11px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:590px){.doctor-note-heading{font-size:25px}.doctor-note-paper{padding-right:12px}.doctor-note-paper textarea{min-height:130px}}

  <script>
const app = document.querySelector('#app');
const state = {
  screen: 'home',

  avatar: { name: 'Sam', skin: 0, outfit: 0 },
  checkup: { wound: false, heartbeat: false, weight: false },

};
const skins = ['#f4d7b9','#f1c49d','#c98961','#86543e'];
const outfits = [{name:'Moss',color:'#557c5b'},{name:'Sky',color:'#6388ac'},{name:'Peach',color:'#cd846a'},{name:'Lilac',color:'#927fae'}];

];
const treatmentCards = [
  {id:'xray',icon:'🩻',title:'X-ray check',use:'Shows the veterinarian pictures of bones so they can look for a break and see what kind it is.',best:'Useful when the vet needs to check a suspected bone injury. It helps find the problem; it does not heal it.'},
  {id:'cast',icon:'🩹',title:'Cast or splint',use:'Supports some broken bones while they heal.',best:'The veterinarian may choose one for certain simple or incomplete breaks. Other fractures need a different plan.'},
  {id:'surgery',icon:'🛠️',title:'Surgery',use:'A veterinary surgeon can use special tools to repair and hold some broken bones in place.',best:'May be used for more complex breaks or when a cast or splint is not the right choice. The vet decides.'},
  {id:'medicine',icon:'💊',title:'Vet-chosen medicine',use:'A veterinarian can choose medicine to help with pain or other needs.',best:'Used only when the vet prescribes it for that animal. Children should never choose or give animal medicine.'},

  {prompt:'What is an X-ray useful for?',choices:['It lets a veterinarian look at bones for a possible break.','It wraps and supports a broken bone.','It replaces a recovery plan.'],answer:0,explain:'X-rays help the veterinarian see bones and check for a break. They help find the problem; they do not heal it.'},
  {prompt:'When might a veterinarian choose a cast or splint?',choices:['For every fracture, without checking it.','For some breaks when the veterinarian decides outside support is suitable.','Whenever an animal is sleepy.'],answer:1,explain:'A cast or splint can support some fractures. The veterinarian decides whether it fits that animal’s injury.'},
  {prompt:'When might surgery be part of a fracture plan?',choices:['For every small injury.','When a child wants to try a new tool.','For some complex breaks when the veterinary team decides it is needed.'],answer:2,explain:'Some more complex fractures may need surgery. The veterinary team chooses based on the injury.'},
  {prompt:'Who chooses medicine for an animal?',choices:['A child guesses a dose.','The veterinarian chooses medicine for that animal when needed.','A friend shares their pet’s medicine.'],answer:1,explain:'Only a veterinarian should choose medicine for an animal. Never guess a dose or share medicine.'},

];
const castPaths = [
  [[108,214],[98,190],[101,166],[99,142],[101,118],[99,94],[101,70],[99,45],[104,18]],
  [[82,214],[132,195],[79,176],[135,157],[77,138],[135,119],[77,100],[132,81],[84,62],[119,42],[106,18]],

];

function avatarFace(){const skin=skins[state.avatar.skin],hair='#49372f';return `<svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Helper avatar face" xmlns="http://www.w3.org/2000/svg"><path d="M50 89h28v27H50z" fill="${skin}"/><path d="M26 58c0-24 16-39 38-39s38 15 38 39v19c0 23-17 39-38 39S26 100 26 77z" fill="${skin}"/><path d="M27 58c-4-25 12-43 37-43 25 0 42 17 37 43l-7-9-5-15c-14 10-33 13-55 10l-3 15z" fill="${hair}"/><g fill="${hair}"><circle cx="36" cy="31" r="10"/><circle cx="49" cy="21" r="10"/><circle cx="64" cy="18" r="10"/><circle cx="79" cy="21" r="10"/><circle cx="92" cy="31" r="10"/></g><path d="M40 69q5-5 10 0m28 0q5-5 10 0" fill="none" stroke="#49372f" stroke-width="3" stroke-linecap="round"/><path d="M55 91q9 7 18 0" fill="none" stroke="#9b5149" stroke-width="3" stroke-linecap="round"/><circle cx="34" cy="72" r="5" fill="${skin}"/><circle cx="94" cy="72" r="5" fill="${skin}"/></svg>`}
function avatarTorso(){const color=outfits[state.avatar.outfit].color;return `<svg width="142" height="84" viewBox="0 0 142 84" role="img" aria-label="Helper wearing a clinic coat" xmlns="http://www.w3.org/2000/svg"><path d="M48 3h46c12 2 24 8 31 19l13 50c1 5-3 9-8 9H12c-5 0-9-4-8-9l13-50C24 11 36 5 48 3Z" fill="${color}"/><path d="m48 3 23 19 23-19-8 23 12 55H44l12-55z" fill="#fffefa"/><path d="m48 3 23 19-15 10-12-26zm46 0L71 22l15 10 12-26z" fill="#e8eee5"/><path d="M71 23v54" stroke="#ffffff80" stroke-width="2"/><circle cx="78" cy="47" r="2" fill="#fffefa"/><circle cx="78" cy="59" r="2" fill="#fffefa"/><circle cx="78" cy="71" r="2" fill="#fffefa"/></svg>`}
function setScreen(screen){state.screen=screen;render()}
function render(){if(state.screen==='home')renderHome();else if(state.screen==='avatar')renderAvatar();else renderCase()}
function renderHome(){app.innerHTML=`<section class="landing"><div class="hero-copy"><div class="eyebrow">PAWPRINT PLANET · VET SKILLS LAB</div><h1>One brave cat.<br><em>One big-hearted helper.</em></h1><p>Meet Miso, find the crack in her X-ray, and build a pretend cast together with the veterinary team.</p><button class="primary" id="begin">Make your helper &nbsp;→</button><div class="hero-tags"><span class="tag"><span>🩻</span>Look closely</span><span class="tag"><span>🩹</span>Build a cast</span></div></div><div class="hero-art"><div class="art-top"><span>✳ &nbsp;PAWPRINT PLANET CLINIC</span><span>TRAINING CASE 01</span></div><div class="sun"></div><div class="leaf one"></div><div class="leaf two"></div><div class="leaf three"></div><div class="clinic-card"><div class="window"></div><div class="plant">🪴</div><div class="pet-cat">🐱</div></div><div class="float-card a">Meet Miso <small>She needs a careful check</small></div><div class="float-card b"><span class="star">✦</span> Vet-led care <small>Practice safely in a simulation</small></div></div></section>`;document.querySelector('#begin').onclick=()=>setScreen('avatar')}
function renderAvatar(){app.innerHTML=`<section class="welcome-card"><div class="steps"><span class="step">01 &nbsp;MEET THE CLINIC</span><span class="step-line"></span><span class="step active">02 &nbsp;MAKE YOUR HELPER</span><span class="step-line"></span><span class="step">03 &nbsp;HELP MISO</span></div><div class="eyebrow">YOUR HELPER BADGE</div><h2>Who’s joining the care team?</h2><p>Build a helper, then follow the vet team through one special training case.</p><div class="avatar-grid"><div class="avatar-preview"><div class="avatar-name-preview" id="name-chip">${esc(state.avatar.name||'Your name')}</div><div class="avatar-sprite"><div class="avatar-face" id="avatar-face">${avatarFace()}</div><div class="avatar-torso" id="avatar-torso">${avatarTorso()}</div><div class="avatar-outfit" id="outfit-preview" style="color:${outfits[state.avatar.outfit].color}">▰ &nbsp;${outfits[state.avatar.outfit].name} clinic coat</div></div></div><div class="form-fields"><div class="field wide"><label for="vet-name">Your helper name</label><input id="vet-name" maxlength="18" value="${esc(state.avatar.name)}" placeholder="Type your name"></div><div class="field"><label>Skin tone</label><div class="choice-dots">${skins.map((s,i)=>`<button class="choice-dot ${i===state.avatar.skin?'selected':''}" data-skin="${i}" style="background:${s}" aria-label="Skin tone ${i+1}"></button>`).join('')}</div></div><div class="field"><label>Clinic coat</label><div class="choice-dots">${outfits.map((o,i)=>`<button class="choice-dot ${i===state.avatar.outfit?'selected':''}" data-outfit="${i}" style="background:${o.color}" aria-label="${o.name} outfit"></button>`).join('')}</div></div><div class="field note">This is a pretend vet-skills lab. Real injuries are treated by veterinary professionals.</div></div></div><div class="card-actions"><button class="text-button" id="back-home">← Back</button><button class="primary" id="start-case">Meet Miso &nbsp;→</button></div></section>`;
 document.querySelector('#vet-name').oninput=e=>{state.avatar.name=e.target.value;document.querySelector('#name-chip').textContent=e.target.value||'Your name'};
 document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.avatar.skin=+b.dataset.skin;document.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('selected',x===b));document.querySelector('#avatar-face').innerHTML=avatarFace()});
 document.querySelectorAll('[data-outfit]').forEach(b=>b.onclick=()=>{state.avatar.outfit=+b.dataset.outfit;document.querySelectorAll('[data-outfit]').forEach(x=>x.classList.toggle('selected',x===b));const o=outfits[state.avatar.outfit];document.querySelector('#avatar-torso').innerHTML=avatarTorso();document.querySelector('#outfit-preview').textContent=`▰  ${o.name} clinic coat`;document.querySelector('#outfit-preview').style.color=o.color});
 document.querySelector('#back-home').onclick=()=>setScreen('home');document.querySelector('#start-case').onclick=()=>{state.avatar.name=state.avatar.name.trim()||'Sam';state.phase='symptoms';state.checkup={wound:false,heartbeat:false,weight:false};state.selectedCheckupTool=null;state.bruiseStory=false;state.woundNote={type:'',color:'',cause:''};state.woundNoteSaved=false;state.doctorNote='';state.castLayers=[false,false,false];state.wrapProgress=0;state.learnedTreatments=[];state.feedback=null;state.caseSaved=false;setScreen('case')};
}
function sceneMarkup(){return `<div class="patient-scene"><div class="scene-header"><span class="scene-chip">✳ &nbsp;PAWPRINT PLANET CLINIC</span><span class="scene-chip">TRAINING CASE 01 · MISO</span></div><div class="scene-wall"></div><div class="scene-floor"></div><div class="scene-window"></div><div class="scene-shelf"></div><div class="scene-plant">🪴</div><div class="counter"></div><div class="speech">${state.phase==='symptoms'?'I fell while chasing a toy. My front leg hurts.':state.phase==='checkup'?'Please check my leg, listen to my heartbeat, and weigh me gently.':state.phase==='xray'?'The vet team took a pretend X-ray. Can you find the tiny crack?':state.phase==='learn'?'The vet team will teach us about each care option first.':state.phase==='quiz'?'Show the vet team what you learned about my care!':state.phase==='plan'?'For my small break, the vet team chose a pretend cast model.':state.phase==='doctor-note'?'Let’s write down my home-care plan!':state.phase==='complete'?'Thank you for being a careful helper!':'Let’s build my pretend cast together!'}</div><div class="patient"><div class="patient-emoji">🐱</div><div class="patient-name">Miso · Cat</div></div></div>`}
function woundNoteMarkup(editable=false){const n=state.woundNote;if(editable)return `<aside class="wound-note-card"><div class="note-tape"></div><div class="wound-note-title">📝 Miso’s exam notes</div><label>Type of wound<input data-note-field="type" value="${esc(n.type)}" placeholder="What do you see?"></label><label>Color of the wound<input data-note-field="color" value="${esc(n.color)}" placeholder="Describe its color"></label><label>How it happened<textarea data-note-field="cause" placeholder="What happened to Miso?">${esc(n.cause)}</textarea></label><small class="note-prompt">Write what you notice. Your note stays visible as you continue.</small></aside>`;return `<aside class="wound-note-card wound-note-compact"><div class="note-tape"></div><div class="wound-note-title">📝 Miso’s exam notes</div><div><b>Wound</b> ${esc(n.type||'—')}</div><div><b>Color</b> ${esc(n.color||'—')}</div><div><b>How</b> ${esc(n.cause||'—')}</div></aside>`}
function woundExamScreen(){const ready=state.bruiseStory&&state.woundNote.type.trim()&&state.woundNote.color.trim()&&state.woundNote.cause.trim();return `<section class="exam-screen wound-exam"><header class="exam-header"><div><div class="eyebrow">PAWPRINT PLANET · MISO’S ROUTINE CHECKUP</div><h1>Inspect the sore leg</h1></div><div class="exam-step-count">CHECKUP 1 OF 3</div></header><div class="exam-workspace"><section class="leg-view-card"><div class="leg-view-copy"><span class="exam-label">GENTLE VISUAL CHECK</span><h2>Look closely at Miso’s front leg</h2><p>The skin is clean and unbroken. Tap the purple mark to learn about the bruise.</p></div><div class="leg-illustration"><svg viewBox="0 0 520 760" role="img" aria-label="Illustration of a clean cat front leg with an intact purple bruise"><defs><linearGradient id="legFur" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bba27f"/><stop offset=".23" stop-color="#e8d5b7"/><stop offset=".52" stop-color="#f6e8cf"/><stop offset=".78" stop-color="#dfc8a5"/><stop offset="1" stop-color="#ad9270"/></linearGradient><radialGradient id="bruiseShade"><stop stop-color="#765080" stop-opacity=".68"/><stop offset=".55" stop-color="#8a6595" stop-opacity=".52"/><stop offset="1" stop-color="#a986ac" stop-opacity="0"/></radialGradient><filter id="furTexture"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="8"/><feColorMatrix values=".45 0 0 0 .5 .35 0 0 0 .4 .25 0 0 0 .3 0 0 0 .12 0"/><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><ellipse cx="260" cy="711" rx="123" ry="19" fill="#6b725c" opacity=".12"/><path d="M203 54C151 81 139 147 164 222c15 45 46 85 48 133 2 48-20 107-22 175-2 70 3 141 34 183 22 29 86 33 119 12 39-26 42-84 36-145-6-65-25-128-18-190 6-52 42-97 49-153 10-78-22-146-83-176-39-20-87-25-124-7Z" fill="url(#legFur)" stroke="#a68e70" stroke-width="5"/><path d="M199 69c-35 35-37 91-16 145 20 50 51 90 49 143-2 60-19 111-17 176 2 70 12 136 43 166" fill="none" stroke="#fff8e8" stroke-width="15" opacity=".42" stroke-linecap="round"/><path d="M373 111c25 44 24 92 4 139m-16 105c-13 58-7 108 3 154m-13 68c9 49 11 94-6 123" fill="none" stroke="#947b60" stroke-width="8" opacity=".18" stroke-linecap="round"/><path d="M215 695c23-15 57-19 91-11 28 7 49 23 56 42-16 22-42 34-82 34-45 0-76-12-91-35 4-13 13-23 26-30Z" fill="#e6d1b1" stroke="#b39a78" stroke-width="4"/><path d="M231 724q-5 18 9 24m28-26q-4 18 10 25m28-25q-1 18 14 22m23-25q5 14 18 16" fill="none" stroke="#ad9270" stroke-width="3" stroke-linecap="round"/><ellipse cx="267" cy="385" rx="74" ry="96" fill="url(#bruiseShade)"/><ellipse cx="268" cy="384" rx="40" ry="54" fill="#7c598c" opacity=".22"/><path d="M242 376q14-12 27 0m-6 20q14-11 29 1m-45 14q12-8 23 2" fill="none" stroke="#6e4d80" stroke-width="8" stroke-linecap="round" opacity=".22"/><g fill="#f5e8d2" opacity=".62"><path d="M176 260q22-8 29 11t-7 29q-22-4-22-40Z"/><path d="M355 516q-22-9-29 10t8 28q23-5 21-38Z"/></g></svg><button class="bruise-hotspot" id="bruise-hotspot" aria-label="Press the purple bruise to learn Miso’s story">✦<span>PRESS TO INSPECT</span></button></div><div class="leg-caption"><span class="bruise-swatch"></span>Closed bruise · skin intact</div></section><aside class="exam-side-rail">${woundNoteMarkup(true)}<section class="bruise-story-card ${state.bruiseStory?'revealed':''}" aria-live="polite">${state.bruiseStory?'<div class="story-badge">MISO’S STORY</div><h2>One awkward landing</h2><p>Miso was chasing her feather toy and jumped down from the sofa. She landed awkwardly on her front leg. The veterinary team found a small break and a bruise, but the skin stayed closed.</p><div class="bruise-facts"><b>What can a bruise look or feel like?</b><span>• Purple or blue discoloration under unbroken skin</span><span>• Tenderness or some swelling around the area</span><span>• The veterinary team checks it with the rest of the injury</span></div>':'<div class="story-placeholder"><span>🐾</span><b>Tap the purple bruise</b><small>Discover what happened to Miso and what bruises can look like.</small></div>'}</section><div class="exam-next-row"><small>${ready?'Great notes. You can continue to Miso’s heartbeat check.':'Inspect the bruise and fill in all three note lines to continue.'}</small><button class="primary" id="continue-wound" ${ready?'':'disabled'}>Next: heartbeat &nbsp;→</button></div></aside></div></section>`}

 if(state.phase==='learn'){const learned=state.learnedTreatments.length;return `<div class="eyebrow">STEP 6 · TREATMENT LEARNING</div><h2>Explore every care option</h2><p class="activity-desc">Open each card to learn what it can help with and when a vet may use it. Then take a short quiz before choosing for Miso.</p><div class="treatment-deck">${treatmentCards.map(card=>{const open=state.learnedTreatments.includes(card.id);return `<button class="treatment-card ${open?'learned':''}" data-learn="${card.id}"><span class="treatment-icon">${card.icon}</span><span class="treatment-copy"><strong>${card.title}</strong><small>${open?'Read and learned ✓':'Tap to learn about this option'}</small>${open?`<span class="treatment-detail"><b>What it helps with</b>${card.use}<b>Where it best applies</b>${card.best}</span>`:''}</span><span class="treatment-arrow">${open?'✓':'＋'}</span></button>`}).join('')}</div><div class="learning-meter"><b>${learned} / ${treatmentCards.length}</b> care options explored</div>${learned===treatmentCards.length?'<div class="activity-actions"><button class="primary" id="continue-treatments">Take the mini quiz &nbsp;→</button></div>':''}<div class="helper-tip"><b>Vet team note</b><br>Different breaks need different care. A veterinarian chooses after examining the animal and checking images.</div>`}

function castMarkup(){const found=state.castLayers.findIndex(done=>!done);const index=found<0?3:found;const layer=castSteps[index];const points=castPaths[index]||[];const pointText=points.map(point=>point.join(',')).join(' ');const reached=points.slice(0,state.wrapProgress+1).map(point=>point.join(',')).join(' ');const handle=points[state.wrapProgress]||points[0]||[0,0];const completed=castSteps.map((step,i)=>state.castLayers[i]?`<polyline class="applied-layer layer-${i}" points="${castPaths[i].map(point=>point.join(',')).join(' ')}"/>`:'').join('');const done=state.castLayers.filter(Boolean).length;return `<div class="eyebrow">STEP 9 · VET-TEAM CAST SIMULATION</div><h2>Build the cast around the leg</h2><p class="activity-desc">Follow the path with the material roll. Each material has a different job, and the model builds one layer at a time.</p><div class="cast-lab realistic-cast"><div class="wrap-model"><div class="wrap-heading"><b>MISO’S MODEL FORELEG</b><span>${done} / 3 layers</span></div><svg class="cast-limb-svg" id="wrap-svg" viewBox="0 0 220 235" role="group" tabindex="0" aria-label="Use the arrow keys to follow the wrapping guide, or drag the roll along the dotted path"><defs><linearGradient id="furTone" x1="0" x2="1"><stop stop-color="#cdbb9a"/><stop offset=".5" stop-color="#f1e5cd"/><stop offset="1" stop-color="#c5b391"/></linearGradient><linearGradient id="boneTone" x1="0" x2="1"><stop stop-color="#e7d7b5"/><stop offset=".5" stop-color="#fff3d7"/><stop offset="1" stop-color="#cdb990"/></linearGradient></defs><ellipse cx="110" cy="220" rx="42" ry="8" fill="#52634d" opacity=".12"/><path class="limb-model" d="M88 15 Q76 18 81 36 L87 52 Q79 70 82 93 L74 171 Q70 190 78 204 Q86 216 110 217 Q134 216 142 204 Q150 190 146 171 L138 93 Q141 70 133 52 L139 36 Q144 18 132 15 Q110 8 88 15Z" fill="url(#furTone)" stroke="#aa9778" stroke-width="2"/><path class="model-bone" d="M102 40 Q94 43 98 55 L96 112 L92 170 Q92 181 101 183 L120 183 Q129 181 127 170 L123 112 L122 55 Q126 43 118 40Z" fill="url(#boneTone)" stroke="#c0aa83" stroke-width="1.5" opacity=".72"/><path d="M94 58 Q89 100 94 148 M128 58 Q132 100 128 148" fill="none" stroke="#c8b693" stroke-width="2" opacity=".7"/><path class="paw-model" d="M79 198 Q72 205 74 212 Q88 222 110 220 Q132 222 146 212 Q148 205 141 198Z" fill="#d4bea0" stroke="#aa9778" stroke-width="2"/><polyline class="trace-guide-line" points="${pointText}"/><g class="applied-layers">${completed}</g>${layer?`<polyline class="trace-progress layer-${index}" id="trace-progress" points="${reached}"/><g class="wrap-handle" id="wrap-handle" transform="translate(${handle[0]} ${handle[1]})"><circle r="13"/><text y="4">↻</text></g>`:''}</svg><div class="trace-progress-track"><div id="trace-progress-fill" style="width:${points.length>1?(state.wrapProgress/(points.length-1))*100:0}%"></div></div><div class="trace-help" id="trace-help">${layer?`Trace the dotted guide with the ${layer.title.toLowerCase()}.`:'All three layers are on the model.'}</div></div><div class="layer-steps">${castSteps.map((step,i)=>`<div class="layer-step ${i<index?'done':i===index?'active':''}"><span>${i<index?'✓':i+1}</span><div><b>${step.title}</b><small>${i<index?'Layer on model':i===index?`${state.wrapProgress} / ${points.length-1} path marks`:'Next in the kit'}</small></div></div>`).join('')}</div></div><div class="wrap-instruction"><span class="instruction-icon">${layer?.icon||'🌟'}</span><div><b>${layer?`Layer ${index+1}: ${layer.title}`:'Three layers complete'}</b><small>${layer?layer.line:'The vet team can now inspect the simulated cast.'}</small></div></div>${state.feedback?`<div class="feedback" id="wrap-feedback">${state.feedback}</div>`:`<div class="feedback hidden" id="wrap-feedback"></div>`}${index===3?'<div class="activity-actions"><button class="primary" id="finish-cast">Ask the vet team to inspect &nbsp;→</button></div>':''}<div class="helper-tip"><b>Classroom simulation</b><br>The guide shows the idea of layered materials, not the pressure, fit, or technique for a real cast. Veterinary professionals apply and check casts.</div>`}
function renderCase(){if(['checkup','heartbeat','weight'].includes(state.phase)){renderExamScreen();return}document.body.classList.remove('exam-immersive');const stages=['symptoms','checkup','heartbeat','weight','xray','learn','quiz','plan','cast','doctor-note','complete'];const ix=stages.indexOf(state.phase);const name=state.avatar.name.toUpperCase();app.innerHTML=`<section class="clinic"><div class="clinic-header"><div><div class="eyebrow">WELCOME, ${esc(name)} · VET SKILLS LAB</div><h1>Miso’s broken-leg case.</h1><p>A guided simulation: complete a routine exam, learn the care options, then wrap a three-layer model cast.</p></div><div><div class="progress-label">CASE STEP ${Math.min(ix+1,11)} / 11</div><div class="progress-track"><div class="progress-fill" style="width:${(ix+1)/11*100}%"></div></div></div></div><div class="game-layout ${state.woundNoteSaved?'has-observation-note':''}">${sceneMarkup()}<aside class="activity-card">${stageMarkup()}</aside>${state.woundNoteSaved?woundNoteMarkup(false):''}</div></section>`;

 const noteField=document.querySelector('#doctor-note-text');if(noteField)noteField.oninput=event=>{state.doctorNote=event.target.value;document.querySelector('#doctor-note-count').textContent=`${state.doctorNote.length} / 800`;document.querySelector('#save-doctors-note').disabled=!state.doctorNote.trim()};
 const saveDoctorNote=document.querySelector('#save-doctors-note');if(saveDoctorNote)saveDoctorNote.onclick=()=>{if(!state.doctorNote.trim())return;state.caseSaved=true;state.phase='complete';state.feedback=null;document.querySelector('#case-count').textContent='1';renderCase()};
 const save=document.querySelector('#open-case-book');if(save)save.onclick=()=>{state.caseSaved=true;document.querySelector('#case-count').textContent='1';openBook()};
}
function attachCheckupInteractions(){const finish=key=>{state.checkup[key]=true;state.selectedCheckupTool=null;renderCase()};document.querySelectorAll('[data-drop-target]').forEach(target=>{const accept=tool=>tool==='stethoscope'&&target.dataset.dropTarget==='heartbeat'||tool==='patient'&&target.dataset.dropTarget==='scale';target.onclick=()=>{if(accept(state.selectedCheckupTool))finish(target.dataset.dropTarget==='heartbeat'?'heartbeat':'weight')};target.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&accept(state.selectedCheckupTool)){event.preventDefault();finish(target.dataset.dropTarget==='heartbeat'?'heartbeat':'weight')}}});document.querySelectorAll('[data-drag-item]').forEach(item=>{const tool=item.dataset.dragItem;let ghost=null;item.onclick=()=>{state.selectedCheckupTool=tool;item.classList.add('selected')};item.addEventListener('pointerdown',event=>{state.selectedCheckupTool=tool;ghost=document.createElement('div');ghost.className='checkup-drag-ghost';ghost.textContent=tool==='stethoscope'?'🩺':'🐱';document.body.append(ghost);const move=e=>{ghost.style.left=`${e.clientX}px`;ghost.style.top=`${e.clientY}px`};move(event);item.setPointerCapture(event.pointerId);event.preventDefault()});item.addEventListener('pointermove',event=>{if(ghost){ghost.style.left=`${event.clientX}px`;ghost.style.top=`${event.clientY}px`}});item.addEventListener('pointerup',event=>{if(!ghost)return;const target=document.querySelector(`[data-drop-target="${tool==='stethoscope'?'heartbeat':'scale'}"]`);const bounds=target.getBoundingClientRect();const dropped=event.clientX>=bounds.left&&event.clientX<=bounds.right&&event.clientY>=bounds.top&&event.clientY<=bounds.bottom;ghost.remove();ghost=null;if(dropped)finish(tool==='stethoscope'?'heartbeat':'weight')});item.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null})})}
function attachWrapInteraction(){const svg=document.querySelector('#wrap-svg');const handle=document.querySelector('#wrap-handle');const progressLine=document.querySelector('#trace-progress');const layerIndex=state.castLayers.findIndex(done=>!done);if(!svg||!handle||layerIndex<0)return;const points=castPaths[layerIndex];let dragging=false;const pointString=limit=>points.slice(0,limit+1).map(point=>point.join(',')).join(' ');const moveToProgress=()=>{const point=points[state.wrapProgress];handle.setAttribute('transform',`translate(${point[0]} ${point[1]})`);progressLine.setAttribute('points',pointString(state.wrapProgress));document.querySelector('#trace-progress-fill').style.width=`${state.wrapProgress/(points.length-1)*100}%`;document.querySelector('#trace-help').textContent=`${state.wrapProgress} of ${points.length-1} guide marks followed`};const showFeedback=message=>{state.feedback=message;const note=document.querySelector('#wrap-feedback');note.textContent=message;note.classList.remove('hidden')};const advance=clientPoint=>{const next=state.wrapProgress+1;if(next>=points.length)return;let bounds=svg.getBoundingClientRect();const target=points[next];const x=(clientPoint.x-bounds.left)/bounds.width*220;const y=(clientPoint.y-bounds.top)/bounds.height*235;const distance=Math.hypot(x-target[0],y-target[1]);if(distance<31){state.wrapProgress=next;moveToProgress();showFeedback('Nice tracing! Keep following the guide toward Miso’s paw.')}};const finishLayer=()=>{if(state.wrapProgress<points.length-1){showFeedback('Keep following the dotted path to finish this layer. You can pick up the roll where you left it.');return}state.castLayers[layerIndex]=true;state.wrapProgress=0;state.feedback=`${castSteps[layerIndex].title} is on the model. The next material is ready.`;renderCase()};handle.addEventListener('pointerdown',event=>{dragging=true;svg.setPointerCapture(event.pointerId);handle.classList.add('is-dragging');event.preventDefault()});svg.addEventListener('pointermove',event=>{if(dragging)advance({x:event.clientX,y:event.clientY})});svg.addEventListener('pointerup',event=>{if(!dragging)return;dragging=false;handle.classList.remove('is-dragging');if(state.wrapProgress===points.length-1)finishLayer()});svg.addEventListener('pointercancel',()=>{dragging=false;handle.classList.remove('is-dragging')});svg.addEventListener('keydown',event=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const next=state.wrapProgress+1;if(next<points.length){state.wrapProgress=next;moveToProgress()}}else if(event.key==='Enter'&&state.wrapProgress===points.length-1){event.preventDefault();finishLayer()}})}
function openBook(){document.querySelector('.case-book')?.remove();const panel=document.createElement('div');panel.className='case-book';panel.innerHTML=`<div class="book-panel"><div class="book-head"><div><div class="eyebrow">YOUR CLINIC COLLECTION</div><h2>Case book <span class="muted">(${state.caseSaved?1:0})</span></h2><div class="muted" style="font-size:12px">A note to remember what you learned today.</div></div><button class="close-button" aria-label="Close case book">×</button></div>${state.caseSaved?`<div class="case-list"><div class="case-row"><div class="case-animal">🐱</div><div class="case-row-details"><strong>Miso · Cat</strong><small>Condition: a small break in the front leg<br>Practice: traced a stockinette sleeve, cast padding, and fiberglass shell model with the vet team.</small><section class="casebook-doctor-note"><b>Doctor’s Note</b><strong>Patient’s Treatment Plan</strong><p>${esc(state.doctorNote)}</p></section></div><span class="case-badge">✦ Helped</span></div></div>`:'<div class="book-empty"><div class="empty-ill">📖</div><b>Miso’s case note is ready!</b><p>Finish the cast and write a home-care plan to save this case.</p></div>'}<div class="book-actions"><button class="secondary" id="close-book">Back to Miso</button>${state.caseSaved?'<button class="primary" id="fresh-start">Play again</button>':''}</div><div class="helper-tip"><b>Real life:</b> always tell a grown-up if an animal is hurt. Only a veterinarian diagnoses and treats injuries.</div></div>`;document.body.append(panel);panel.querySelectorAll('.close-button,#close-book').forEach(b=>b.onclick=()=>panel.remove());panel.querySelector('#fresh-start')?.addEventListener('click',()=>{panel.remove();state.phase='symptoms';state.checkup={wound:false,heartbeat:false,weight:false};state.selectedCheckupTool=null;state.bruiseStory=false;state.woundNote={type:'',color:'',cause:''};state.woundNoteSaved=false;state.doctorNote='';state.castLayers=[false,false,false];state.wrapProgress=0;state.learnedTreatments=[];state.feedback=null;state.caseSaved=false;document.querySelector('#case-count').textContent='0';renderCase()});panel.addEventListener('click',e=>{if(e.target===panel)panel.remove()})}
document.querySelector('#open-book').onclick=openBook;
render();

</script>
